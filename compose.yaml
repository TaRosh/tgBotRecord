services:
  # Боевой запуск:
  #   docker compose up -d --build   — собрать и запустить в фоне
  #   docker compose logs -f bot     — смотреть логи
  #   docker compose down            — остановить (данные в томе сохранятся)
  bot:
    build: .
    image: tgbotrecord:latest
    restart: unless-stopped # поднимется после падения и перезагрузки сервера
    env_file: .env
    environment:
      DB_PATH: /data/bot.db # в контейнере база всегда в томе
    volumes:
      - botdata:/data
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: # без ограничения логи со временем займут весь диск
        max-size: 10m
        max-file: "3"

  # Окружение разработки (не стартует при `up`, только через `run`):
  #   docker compose run --rm dev go test ./...
  #   docker compose run --rm dev go run ./cmd/bot
  dev:
    profiles: [dev]
    image: golang:1.27
    working_dir: /app
    volumes:
      - .:/app
      - gomod:/go/pkg/mod
      - gocache:/root/.cache/go-build
    # Значения подставляются из файла .env (если он есть)
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      ADMIN_ID: ${ADMIN_ID:-}
      TIMEZONE: ${TIMEZONE:-}
      DB_PATH: ${DB_PATH:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      REMIND_BEFORE: ${REMIND_BEFORE:-}

  # Линтер той же версии, что и в CI:
  #   docker compose run --rm lint golangci-lint run
  lint:
    profiles: [dev]
    image: golangci/golangci-lint:v2.14.0
    working_dir: /app
    volumes:
      - .:/app
      - gomod:/go/pkg/mod
      - lintcache:/root/.cache

volumes:
  botdata:
  gomod:
  gocache:
  lintcache:
